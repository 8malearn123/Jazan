<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b5a4a"/>
      <stop offset="1" stop-color="#123f34"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#2a7a64"/>
      <stop offset="1" stop-color="#2a7a64" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghutra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e2d6"/>
    </linearGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1e9"/>
      <stop offset="1" stop-color="#d9d3c4"/>
    </linearGradient>
    <linearGradient id="thobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfcf9"/>
      <stop offset="1" stop-color="#e7e3d7"/>
    </linearGradient>
    <radialGradient id="skin" cx=".42" cy=".36" r=".85">
      <stop offset="0" stop-color="#f6c99c"/>
      <stop offset=".7" stop-color="#efb887"/>
      <stop offset="1" stop-color="#dfa06a"/>
    </radialGradient>
  </defs>

  <rect width="800" height="640" fill="url(#bg)"/>
  <rect width="800" height="640" fill="url(#glow)"/>

  <g fill="none" stroke="#0e3a2f" stroke-width="5" opacity=".35">
    <circle cx="400" cy="310" r="252"/>
    <circle cx="400" cy="310" r="222"/>
  </g>

  <ellipse cx="400" cy="606" rx="330" ry="42" fill="#0c352b" opacity=".75"/>

  <g transform="translate(400 330)">

    <!-- ghutra side drapes -->
    <path d="M-48 -210 C-96 -178 -108 -70 -94 26 C-84 90 -60 128 -32 124 L-44 -110 Z" fill="url(#drape)"/>
    <path d="M48 -210 C96 -178 108 -70 94 26 C84 90 60 128 32 124 L44 -110 Z" fill="url(#drape)"/>
    <path d="M-84 -56 C-90 12 -84 66 -68 108" stroke="#c9c2b0" stroke-width="4.5" fill="none" opacity=".5"/>
    <path d="M84 -56 C90 12 84 66 68 108" stroke="#c9c2b0" stroke-width="4.5" fill="none" opacity=".5"/>

    <!-- torso -->
    <path d="M-172 300 C-176 108 -102 16 0 16 C102 16 176 108 172 300 Z" fill="url(#thobe)"/>
    <path d="M-132 58 C-146 108 -152 180 -152 300 M132 58 C146 108 152 180 152 300" stroke="#d6d0c1" stroke-width="4" fill="none" opacity=".6"/>

    <!-- neck -->
    <path d="M-24 -70 C-12 -50 12 -50 24 -70 L24 -26 C10 -14 -10 -14 -24 -26 Z" fill="#e9ab77"/>
    <path d="M-24 -58 C-10 -46 10 -46 24 -58 L24 -46 C10 -36 -10 -36 -24 -46 Z" fill="#d08f5c" opacity=".55"/>

    <!-- collar & placket -->
    <path d="M-38 -36 C-14 -20 14 -20 38 -36 L38 -6 C14 10 -14 10 -38 -6 Z" fill="#fbfaf6" stroke="#d8d3c6" stroke-width="2.5"/>
    <path d="M-10 2 L10 2 L12 150 L-12 150 Z" fill="#f7f5ef"/>
    <path d="M-10 2 L-11 150 M10 2 L11 150" stroke="#d3cdbd" stroke-width="2" fill="none"/>
    <circle cx="0" cy="34" r="5.5" fill="#ddd7c8"/>
    <circle cx="0" cy="72" r="5.5" fill="#ddd7c8"/>
    <circle cx="0" cy="110" r="5.5" fill="#ddd7c8"/>

    <!-- head -->
    <g transform="translate(0 -134) scale(1.12)">
      <ellipse cx="-62" cy="8" rx="11" ry="16" fill="#e6a570"/>
      <ellipse cx="62" cy="8" rx="11" ry="16" fill="#e6a570"/>
      <ellipse cx="0" cy="0" rx="62" ry="66" fill="url(#skin)"/>

      <!-- beard along jaw, framing mouth -->
      <path d="M-56 -10 C-62 36 -36 66 0 68 C36 66 62 36 56 -10 C50 2 43 8 35 11 C45 30 28 48 0 48 C-28 48 -45 30 -35 11 C-43 8 -50 2 -56 -10 Z" fill="#241a10"/>

      <!-- mustache -->
      <path d="M-27 13 C-16 21 16 21 27 13 C15 6 -15 6 -27 13 Z" fill="#241a10"/>
      <!-- smiling mouth -->
      <path d="M-22 18 C-10 28 10 28 22 18 C16 36 -16 36 -22 18 Z" fill="#ffffff" stroke="#1a120a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- soul patch -->
      <path d="M-7 36 C-3 41 3 41 7 36 L5 46 C2 49 -2 49 -5 46 Z" fill="#241a10"/>

      <!-- eyebrows -->
      <path d="M-37 -29 C-28 -36 -12 -36 -6 -31" stroke="#241a10" stroke-width="8.5" fill="none" stroke-linecap="round"/>
      <path d="M37 -29 C28 -36 12 -36 6 -31" stroke="#241a10" stroke-width="8.5" fill="none" stroke-linecap="round"/>

      <!-- eyes -->
      <ellipse cx="-22" cy="-13" rx="12.5" ry="9.5" fill="#ffffff"/>
      <ellipse cx="22" cy="-13" rx="12.5" ry="9.5" fill="#ffffff"/>
      <circle cx="-21" cy="-13" r="6" fill="#4a2f18"/>
      <circle cx="23" cy="-13" r="6" fill="#4a2f18"/>
      <circle cx="-21" cy="-13" r="2.8" fill="#1c120a"/>
      <circle cx="23" cy="-13" r="2.8" fill="#1c120a"/>
      <circle cx="-19" cy="-15" r="1.7" fill="#ffffff"/>
      <circle cx="25" cy="-15" r="1.7" fill="#ffffff"/>

      <!-- nose -->
      <path d="M1 -6 C4 1 4 7 -2 11" stroke="#d68f5f" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- blush -->
      <ellipse cx="-42" cy="2" rx="8.5" ry="6" fill="#e59a63" opacity=".45"/>
      <ellipse cx="42" cy="2" rx="8.5" ry="6" fill="#e59a63" opacity=".45"/>

      <!-- ghutra over skull, edge dips at center of forehead -->
      <path d="M-64 -26 C-40 -44 -14 -48 0 -39 C14 -48 40 -44 64 -26 C76 -58 68 -98 44 -116 C22 -131 -22 -131 -44 -116 C-68 -98 -76 -58 -64 -26 Z" fill="url(#ghutra)"/>

      <!-- agal: doubled black cord -->
      <path d="M-52 -95 C-28 -113 28 -113 52 -95" stroke="#2a231c" stroke-width="15" fill="none" stroke-linecap="round"/>
      <path d="M-58 -79 C-32 -99 32 -99 58 -79" stroke="#15100c" stroke-width="15" fill="none" stroke-linecap="round"/>
      <path d="M-46 -99 C-26 -112 26 -112 46 -99" stroke="#4a4138" stroke-width="3" fill="none" opacity=".7"/>
    </g>

    <!-- crossed arms -->
    <path d="M-132 82 C-104 136 -26 162 80 154" stroke="#e9e5d9" stroke-width="58" fill="none" stroke-linecap="round"/>
    <path d="M-108 118 C-54 150 18 158 82 152" stroke="#d9d3c4" stroke-width="5" fill="none" opacity=".7"/>
    <path d="M132 82 C108 132 30 168 -72 160" stroke="#f6f4ee" stroke-width="60" fill="none" stroke-linecap="round"/>
    <path d="M108 120 C54 156 -18 164 -70 160" stroke="#dcd6c8" stroke-width="4" fill="none" opacity=".6"/>

    <!-- visible hand resting on the upper arm -->
    <g transform="translate(-94 148) rotate(-18)">
      <ellipse cx="0" cy="0" rx="27" ry="18" fill="#efb887"/>
      <path d="M-11 -14 C-8 -5 -8 7 -11 15 M1 -17 C4 -6 4 7 1 17 M13 -14 C16 -5 16 5 13 13" stroke="#d99c66" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="-20" cy="4" rx="7" ry="10" fill="#e6a570"/>
    </g>
  </g>
</svg>
